apiVersion: apps/v1
kind: Deployment
metadata:
  name: docuquery-api
  labels:
    app: docuquery-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: docuquery-api
  template:
    metadata:
      labels:
        app: docuquery-api
    spec:
      containers:
        - name: docuquery-api
          image: docuquery-api:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: "sqlite:///./docuquery.db"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
